
name: Build Mark Neil Dictionary APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark_Neil_Dictionary_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip -q Mark_Neil_Dictionary_Android_Project.zip -d source
          cd source/mark_neil_dictionary
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mark-Neil-Dictionary-APK
          path: source/mark_neil_dictionary/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
